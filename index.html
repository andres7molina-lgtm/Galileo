<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galileo IA 2.0 · Física</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="brand">✦ Galileo <span>IA</span></div><p>Tu tutor de Física: pregunta a tu manera.</p></header><section class="topics"><button data-example="Explícame MRU usando unicornios">🦄 Unicornios</button><button data-example="Explícame MRU con una analogía del Hombre Araña">🕸️ Superhéroes</button><button data-example="No entiendo qué es la velocidad, explícame desde cero">💡 Desde cero</button></section><section id="chat" role="log" aria-label="Conversación" aria-live="polite"><div class="bubble bot">¡Hola! Soy Galileo. Podemos aprender MRU con unicornios, superhéroes o lo que más te guste. ¿Qué te gustaría entender hoy?</div></section><form id="form"><label for="message">Tu pregunta</label><div class="input-row"><input id="message" maxlength="2000" placeholder="Pregúntame lo que quieras sobre Física..." required autocomplete="off"><button id="send" type="submit">Enviar</button></div></form><div class="controls"><button id="mic" type="button" aria-label="Hablar por micrófono">🎤 Hablar</button><button id="stop" type="button">■ Detener voz</button><label><input type="checkbox" id="speak" checked> Respuestas habladas</label></div><p id="status" role="status"></p><footer>Prototipo educativo. La IA puede equivocarse. No compartas datos personales.</footer></main><script src="/app.js"></script></body></html>
